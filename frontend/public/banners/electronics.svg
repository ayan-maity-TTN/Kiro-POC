<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <!-- Laptop -->
  <rect x="120" y="100" width="260" height="170" rx="10" fill="#263238"/>
  <rect x="135" y="115" width="230" height="140" rx="4" fill="#1a237e"/>
  <!-- Screen gradient -->
  <rect x="135" y="115" width="230" height="140" rx="4" fill="url(#screenGrad)"/>
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e91e63"/>
      <stop offset="50%" style="stop-color:#ff9800"/>
      <stop offset="100%" style="stop-color:#2196f3"/>
    </linearGradient>
  </defs>
  <path d="M100 270 L400 270 L420 290 L80 290 Z" fill="#37474f"/>
  <!-- Phone -->
  <rect x="30" y="150" width="60" height="110" rx="8" fill="#1a1a2e"/>
  <rect x="35" y="158" width="50" height="90" rx="4" fill="#4fc3f7"/>
  <!-- Headphones -->
  <path d="M380 80 Q420 40 460 80" stroke="#333" stroke-width="8" fill="none" stroke-linecap="round"/>
  <rect x="370" y="75" width="20" height="50" rx="10" fill="#333"/>
  <rect x="450" y="75" width="20" height="50" rx="10" fill="#333"/>
  <rect x="368" y="95" width="24" height="35" rx="5" fill="#e53935"/>
  <rect x="448" y="95" width="24" height="35" rx="5" fill="#e53935"/>
  <!-- Smartwatch -->
  <rect x="60" y="300" width="40" height="50" rx="8" fill="#212121"/>
  <rect x="65" y="308" width="30" height="35" rx="4" fill="#00e676"/>
  <rect x="72" y="290" width="16" height="12" rx="3" fill="#424242"/>
  <rect x="72" y="348" width="16" height="12" rx="3" fill="#424242"/>
</svg>
